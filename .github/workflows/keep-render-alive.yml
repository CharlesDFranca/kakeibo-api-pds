name: Keep Render API Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render API
        run: |
          curl --silent --show-error \
            --max-time 30 \
            https://kakeibo-api-pds.onrender.com/health
